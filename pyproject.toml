[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligence-degradation-detection"
version = "0.1.0"
description = "A private, reproducible model evaluation dashboard"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx[socks]>=0.28,<1",
  "apscheduler>=3.11,<4", "PyYAML>=6,<7", "numpy>=2.2,<3",
  "regex>=2024.11", "itsdangerous>=2.2,<3", "tzdata>=2025.1",
  "croniter>=6,<7",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "build>=1.2"]

[project.scripts]
idd = "intelligence_degradation_detection.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "threeparty"]
include = ["intelligence_degradation_detection*", "modeltrace_vendor*"]

[tool.setuptools.package-data]
modeltrace_vendor = ["data/*.json", "LICENSE", "UPSTREAM.json"]
intelligence_degradation_detection = ["adapters/migrations/script.py.mako"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["threeparty"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src/intelligence_degradation_detection"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

