services:
  idd:
    build: .
    image: intelligence-degradation-detection:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: ${TZ:-UTC}
      IDD_ROOT_PATH: ${IDD_ROOT_PATH:-}
      IDD_SECURE_COOKIE: ${IDD_SECURE_COOKIE:-0}
    volumes:
      - idd-data:/app/resources/data
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  idd-data:
